# Consumer example: current package with summary support, authorized test app startup,
# and verify:outcome configured with the copyable ci-run.mjs recipe. See ci-integration.md.
name: Verify feature outcome
on: [pull_request]
permissions:
  contents: read
jobs:
  outcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      # Your verify:outcome script starts/waits for the test app, then calls ci-run.mjs.
      - run: npm run verify:outcome
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: promiseproof-evidence
          path: .promiseproof/runs
          retention-days: 7
          include-hidden-files: true
      - name: Link retained evidence
        if: always() && steps.evidence.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf '\n[Download evidence artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
