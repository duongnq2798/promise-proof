name: Verify PromiseProof
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - run: node scripts/generate-samples.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcome-evidence-${{ matrix.os }}-node${{ matrix.node }}
          path: .promiseproof/runs
          retention-days: 7
          include-hidden-files: true
      - run: npm pack
      - run: node scripts/package-smoke.mjs promiseproof-local-0.1.0.tgz
